<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1380" viewBox="0 0 1880 1380" role="img" aria-labelledby="title desc">
  <title id="title">Full pipeline for boundary-aware rationale selection</title>
  <desc id="desc">Three-panel pipeline: teacher rationale generation, boundary rationale selection, and student training with selected rationales.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4b5563"/>
    </marker>
    <linearGradient id="teacher" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#5f3fd6"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f6ff"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eefaf1"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7e6"/>
    </linearGradient>
  </defs>

  <rect width="1880" height="1380" fill="#ffffff"/>

  <text x="940" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">
    Boundary-Aware Extension of Rationale-Based Distillation
  </text>

  <rect x="22" y="82" width="1836" height="398" rx="22" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="52" y="132" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">(a) Teacher rationale generation</text>

  <rect x="58" y="182" width="360" height="236" rx="18" fill="#fafafa" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="92" y="233" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">Input example</text>
  <text x="92" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">Premise:</text>
  <text x="183" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">The band played their final</text>
  <text x="92" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">song, and the audience gave</text>
  <text x="92" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">a standing ovation.</text>
  <text x="92" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">Hypothesis:</text>
  <text x="202" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">The audience enjoyed</text>
  <text x="92" y="413" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">the performance.</text>

  <circle cx="650" cy="300" r="112" fill="url(#teacher)" stroke="#4f36c5" stroke-width="2"/>
  <text x="650" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Teacher</text>
  <text x="650" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">LLM</text>
  <text x="650" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ece7ff">label + rationale</text>

  <path d="M418 300 H526" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="930" y="120" width="560" height="76" rx="13" fill="url(#softBlue)" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="950" y="152" font-size="18" fill="#111827">The standing ovation shows the audience</text>
    <text x="950" y="180" font-size="18" fill="#111827">appreciated the performance.</text>
    <rect x="1408" y="145" width="64" height="30" rx="8" fill="#eaf1ff" stroke="#3b82f6"/>
    <text x="1440" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#155bd6">causal</text>

    <rect x="930" y="218" width="560" height="76" rx="13" fill="url(#softBlue)" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="950" y="250" font-size="18" fill="#111827">A standing ovation would be unlikely if the</text>
    <text x="950" y="278" font-size="18" fill="#111827">audience disliked the performance.</text>
    <rect x="1370" y="243" width="102" height="30" rx="8" fill="#eaf1ff" stroke="#3b82f6"/>
    <text x="1421" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#155bd6">contrastive</text>

    <rect x="930" y="316" width="560" height="76" rx="13" fill="url(#softBlue)" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="950" y="348" font-size="18" fill="#111827">Historically, standing ovations are given</text>
    <text x="950" y="376" font-size="18" fill="#111827">when audiences are impressed.</text>
    <rect x="1380" y="341" width="92" height="30" rx="8" fill="#eaf1ff" stroke="#3b82f6"/>
    <text x="1426" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#155bd6">historical</text>
  </g>

  <path d="M762 300 C820 300 840 158 920 158" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M762 300 C830 300 842 256 920 256" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M762 300 C820 300 840 354 920 354" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="1620" y="248" width="160" height="104" rx="16" fill="#effaf1" stroke="#22a447" stroke-width="1.6"/>
  <text x="1700" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#15803d">✓</text>
  <text x="1700" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#15803d">entailment</text>
  <path d="M1490 256 C1540 256 1545 300 1610 300" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1490 354 C1540 354 1545 300 1610 300" stroke="#4b5563" stroke-width="3" fill="none"/>

  <path d="M210 418 V510" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="22" y="506" width="1836" height="380" rx="22" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="52" y="558" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">(b) Boundary rationale selection</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="620" width="188" height="120" rx="12" fill="url(#softBlue)" stroke="#2563eb" stroke-width="1.6"/>
    <text x="152" y="660" text-anchor="middle" font-size="19" fill="#111827">Candidate</text>
    <text x="152" y="686" text-anchor="middle" font-size="19" fill="#111827">rationales</text>
    <circle cx="110" cy="716" r="6" fill="#2563eb"/>
    <rect x="128" y="709" width="44" height="10" rx="3" fill="#dbeafe" stroke="#2563eb"/>

    <rect x="300" y="620" width="158" height="120" rx="12" fill="#faf8ff" stroke="#6d5bd0" stroke-width="1.6"/>
    <text x="379" y="660" text-anchor="middle" font-size="18" fill="#111827">Group by</text>
    <text x="379" y="686" text-anchor="middle" font-size="18" fill="#111827">example</text>
    <text x="379" y="724" text-anchor="middle" font-size="28" fill="#6d5bd0">C_i</text>

    <rect x="510" y="620" width="158" height="120" rx="12" fill="#faf8ff" stroke="#6d5bd0" stroke-width="1.6"/>
    <text x="589" y="660" text-anchor="middle" font-size="18" fill="#111827">Weighted</text>
    <text x="589" y="686" text-anchor="middle" font-size="18" fill="#111827">vote</text>
    <text x="589" y="724" text-anchor="middle" font-size="19" fill="#6d5bd0">V_i(y)</text>

    <rect x="720" y="620" width="158" height="120" rx="12" fill="#faf8ff" stroke="#6d5bd0" stroke-width="1.6"/>
    <text x="799" y="660" text-anchor="middle" font-size="18" fill="#111827">Confidence</text>
    <text x="799" y="686" text-anchor="middle" font-size="18" fill="#111827">margin</text>
    <text x="799" y="724" text-anchor="middle" font-size="19" fill="#6d5bd0">m_i</text>

    <rect x="930" y="620" width="158" height="120" rx="12" fill="#faf8ff" stroke="#6d5bd0" stroke-width="1.6"/>
    <text x="1009" y="660" text-anchor="middle" font-size="18" fill="#111827">Judge</text>
    <text x="1009" y="686" text-anchor="middle" font-size="18" fill="#111827">rationale</text>
    <text x="1009" y="724" text-anchor="middle" font-size="19" fill="#6d5bd0">Q(c_i,k)</text>

    <rect x="1140" y="620" width="178" height="120" rx="12" fill="#faf8ff" stroke="#6d5bd0" stroke-width="1.6"/>
    <text x="1229" y="660" text-anchor="middle" font-size="18" fill="#111827">Assign</text>
    <text x="1229" y="686" text-anchor="middle" font-size="18" fill="#111827">difficulty band</text>
    <text x="1229" y="724" text-anchor="middle" font-size="19" fill="#6d5bd0">z_i</text>

    <rect x="1400" y="592" width="132" height="58" rx="12" fill="#effaf1" stroke="#22a447" stroke-width="1.4"/>
    <text x="1466" y="628" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">Easy</text>
    <rect x="1400" y="668" width="132" height="58" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.4"/>
    <text x="1466" y="704" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c">Boundary</text>
    <rect x="1400" y="744" width="132" height="58" rx="12" fill="#fff5f5" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="1466" y="780" text-anchor="middle" font-size="19" font-weight="700" fill="#dc2626">Hard</text>

    <rect x="1620" y="634" width="200" height="126" rx="12" fill="url(#softBlue)" stroke="#2563eb" stroke-width="1.6"/>
    <text x="1720" y="674" text-anchor="middle" font-size="20" font-weight="700" fill="#155bd6">Selected training</text>
    <text x="1720" y="700" text-anchor="middle" font-size="20" font-weight="700" fill="#155bd6">rationale</text>
    <text x="1720" y="730" text-anchor="middle" font-size="16" fill="#155bd6">keep easy + boundary</text>
  </g>

  <path d="M246 680 H290" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

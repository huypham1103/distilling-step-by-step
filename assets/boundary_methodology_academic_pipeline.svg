  <text x="1588" y="782" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#dc2626">drop</text>

  <rect x="70" y="792" width="640" height="52" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="104" y="826" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d97706">Proposed method:</text>
  <text x="276" y="826" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Boundary-Mix rationale selection</text>

  <rect x="790" y="792" width="520" height="52" rx="10" fill="#ffffff" stroke="#a3a3a3" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="816" y="825" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">Same-family comparisons: Boundary-Bridge, Boundary-Specialist</text>

  <path d="M1720 760 V918" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="22" y="914" width="1836" height="420" rx="22" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="52" y="968" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">(c) Student training</text>

  <rect x="58" y="1060" width="250" height="122" rx="12" fill="url(#softBlue)" stroke="#2563eb" stroke-width="1.6"/>
  <text x="183" y="1110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#155bd6">x: input example</text>

  <rect x="400" y="1015" width="300" height="180" rx="12" fill="url(#softGold)" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="550" y="1064" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#c76a00">Student model</text>
  <line x1="450" y1="1128" x2="650" y2="1068" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="450" y1="1078" x2="650" y2="1138" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="450" cy="1078" r="8" fill="#fed7aa" stroke="#d97706"/>
  <circle cx="450" cy="1128" r="8" fill="#fed7aa" stroke="#d97706"/>
  <circle cx="550" cy="1104" r="8" fill="#fed7aa" stroke="#d97706"/>
  <circle cx="650" cy="1078" r="8" fill="#fed7aa" stroke="#d97706"/>
  <circle cx="650" cy="1128" r="8" fill="#fed7aa" stroke="#d97706"/>

  <path d="M308 1121 H390" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="820" y="1005" width="190" height="88" rx="12" fill="url(#softGreen)" stroke="#22a447" stroke-width="1.4"/>
  <text x="915" y="1041" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#15803d">ŷ</text>
  <text x="915" y="1070" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#15803d">predicted label</text>

  <rect x="820" y="1145" width="190" height="88" rx="12" fill="#f7f4ff" stroke="#6d5bd0" stroke-width="1.4"/>
  <text x="915" y="1181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#5b44d1">r̂</text>
  <text x="915" y="1210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b44d1">predicted rationale</text>

  <rect x="1090" y="1005" width="178" height="88" rx="12" fill="url(#softGreen)" stroke="#22a447" stroke-width="1.4"/>
  <text x="1179" y="1046" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#15803d">y: label</text>
  <text x="1179" y="1073" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#15803d">✓</text>

  <rect x="1090" y="1145" width="178" height="88" rx="12" fill="#f7f4ff" stroke="#6d5bd0" stroke-width="1.4"/>
  <text x="1179" y="1179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b44d1">r*: selected</text>
  <text x="1179" y="1206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b44d1">rationale</text>

  <rect x="1360" y="1005" width="250" height="88" rx="12" fill="url(#softGreen)" stroke="#22a447" stroke-width="1.4"/>
  <text x="1485" y="1042" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#15803d">Label loss</text>
  <text x="1485" y="1072" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111827">L_label = -log P(y|x;θ)</text>

  <rect x="1360" y="1145" width="250" height="88" rx="12" fill="#f7f4ff" stroke="#6d5bd0" stroke-width="1.4"/>
  <text x="1485" y="1182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5b44d1">Rationale loss</text>
  <text x="1485" y="1212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111827">L_rat = -log P(r*|x;θ)</text>

  <rect x="1668" y="1068" width="170" height="110" rx="12" fill="#fff5f5" stroke="#ef4444" stroke-width="1.4"/>
  <text x="1753" y="1106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">Multi-task loss</text>
  <text x="1753" y="1140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111827">L = L_label</text>
  <text x="1753" y="1166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111827">+ λ L_rat</text>

